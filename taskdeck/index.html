<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Deck</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Cpath d=%27M26 4l4.500 12.500L43 21l-12.500 4.500L26 38l-4.500-12.500L9 21l12.500-4.500z%27 fill=%27%235560e0%27/%3E%3Ccircle cx=%2710%27 cy=%2738%27 r=%273%27 fill=%27%23f2b632%27/%3E%3C/svg%3E">
<meta property="og:title" content="Task Deck">
<meta property="og:description" content="Paste your to-do list, swipe through it as cards, and finish tasks with a focus timer. Skipping is always free.">
<meta property="og:type" content="website">
<meta name="description" content="Paste your to-do list, swipe through it as cards, and finish tasks with a focus timer, XP and streaks. Skipping is always free.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calm stats rail on the left, one big tactile stage on the right where the card deck, estimate, timer and celebration take turns. */
:root{
  --paper:#f4f4fb;
  --card:#ffffff;
  --ink:#1c2250;
  --ink-soft:#5a608a;
  --line:#e2e4f3;
  --iris:#5560e0;
  --iris-ink:#ffffff;
  --iris-tint:#e8eafc;
  --mint:#2b9f78;
  --mint-tint:#dcf4ea;
  --peach:#d9822b;
  --peach-tint:#fdeedb;
  --gold:#f2b632;
  --mint-ink:#ffffff;
  --p-work-bg:#fde4e4;--p-work-fg:#9a2a2a;--p-home-bg:#fdeedb;--p-home-fg:#9a5a12;--p-health-bg:#dcf4ea;--p-health-fg:#176a4d;--p-life-bg:#f3e5fb;--p-life-fg:#7a3a96;
  --shadow:0 18px 40px -18px rgba(40,48,120,.35),0 2px 6px rgba(40,48,120,.06);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--iris);outline-offset:3px;border-radius:10px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1120px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px;order:-1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 4px 6px}
.brand svg{width:44px;height:44px}
.brand b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;display:block;line-height:1.05}
.brand span{color:var(--ink-soft);font-size:14px}
.label{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:10px}
.prog{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:var(--line);stroke-width:11}
.ring .a{fill:none;stroke:var(--mint);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px}
.prog p{color:var(--ink-soft);font-size:14px}
.streak{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.streak svg{color:var(--peach)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--ink-soft)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);margin:0 auto 4px;display:grid;place-items:center;color:var(--iris-ink)}
.dot.on{background:var(--mint);border-color:var(--mint)}
.dot.on svg{width:14px;height:14px;stroke-width:3}
.dot.today{border-color:var(--iris)}
.dot.on.today{border-color:var(--mint)}
.small{font-size:13px;color:var(--ink-soft)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--iris);border-radius:99px;transition:width .6s ease}
.lvl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvl b{font-family:var(--display);font-size:20px;font-weight:800}
.free{background:var(--mint-tint);border-color:transparent;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.free svg{color:var(--mint);margin-top:2px}

.main{min-width:0}
.top{position:relative;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.top h1{font-weight:800;font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;line-height:1.05}
.top p{color:var(--ink-soft);margin-top:4px}
.mini{display:none;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--iris-tint);border-radius:16px;margin-bottom:22px;width:fit-content;max-width:100%}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 16px;font-weight:700;color:var(--ink-soft);display:flex;gap:8px;align-items:center;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(40,48,120,.15)}
nav.tabs .n{font-size:12px;background:var(--iris);color:var(--iris-ink);border-radius:99px;padding:0 7px;min-width:20px;text-align:center}

.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--iris-tint);color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--iris);color:var(--iris-ink)}
.btn.good{background:var(--mint);color:var(--mint-ink)}
.btn.big{padding:16px 22px;font-size:17px;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}

/* deck */
.deckwrap{max-width:540px;margin:0 auto}
.deck{position:relative;height:360px;margin:8px 0 34px;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0;border-radius:30px;box-shadow:var(--shadow)}
.l1{background:var(--iris-tint);transform:translateY(14px) scale(.955) rotate(-1.4deg)}
.l2{background:var(--mint-tint);transform:translateY(26px) scale(.91) rotate(1.8deg)}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:26px 26px 22px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;cursor:grab;will-change:transform}
.card:active{cursor:grabbing}
.card .row{display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-block;font-size:14px;font-weight:700;padding:4px 14px;border-radius:99px}
.cat-work{background:var(--p-work-bg);color:var(--p-work-fg)}.cat-home{background:var(--p-home-bg);color:var(--p-home-fg)}.cat-health{background:var(--p-health-bg);color:var(--p-health-fg)}.cat-learn{background:var(--iris-tint);color:var(--ink)}.cat-life{background:var(--p-life-bg);color:var(--p-life-fg)}
.glyph{width:46px;height:46px;border-radius:14px;background:var(--iris-tint);color:var(--iris);display:grid;place-items:center}
.glyph svg{width:26px;height:26px}
.card h2{font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.08;letter-spacing:-.025em;margin-top:6px}
.card .hint{color:var(--ink-soft);font-size:17px;line-height:1.4}
.meta{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meta div{display:flex;gap:10px;align-items:center;min-width:0}
.meta svg{color:var(--iris);width:26px;height:26px}
.meta b{display:block;font-size:16px;line-height:1.15}
.meta span{font-size:12px;color:var(--ink-soft);line-height:1.1;display:block}
.stamp{position:absolute;top:22px;font-family:var(--display);font-weight:800;font-size:20px;border:3px solid;border-radius:12px;padding:2px 12px;opacity:0;pointer-events:none;background:var(--card)}
.stamp.later{left:22px;color:var(--peach);transform:rotate(-8deg)}
.stamp.now{right:22px;color:var(--mint);transform:rotate(8deg)}
.actions{display:flex;justify-content:center;gap:56px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;font-weight:700;font-size:15px}
.act i{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
.act:hover i{transform:scale(1.07)}
.act i svg{width:34px;height:34px;stroke-width:2.6}
.act.later i{background:var(--peach-tint);color:var(--peach)}
.act.now i{background:var(--mint-tint);color:var(--mint)}
.act kbd{font:inherit;font-size:12px;color:var(--ink-soft);font-weight:500}
.note{text-align:center;color:var(--ink-soft);font-size:14px;margin-top:20px;min-height:1.4em}
.empty{text-align:center;padding:48px 16px;background:var(--card);border:1px dashed var(--line);border-radius:26px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-size:28px;font-weight:800}
.empty p{color:var(--ink-soft);max-width:36ch}

/* sheets: estimate, focus, done */
.sheet{max-width:540px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.eyebrow{font-size:14px;font-weight:700;color:var(--ink-soft)}
.sheet h2{font-size:clamp(24px,4.5vw,30px);font-weight:800;line-height:1.1;letter-spacing:-.02em}
.est{display:flex;align-items:center;gap:18px}
.est .big{font-family:var(--display);font-weight:800;font-size:76px;line-height:1;letter-spacing:-.04em;min-width:2.2ch}
.est small{display:block;font-size:15px;font-weight:500;color:var(--ink-soft);letter-spacing:0}
.round{width:52px;height:52px;border-radius:50%;border:0;background:var(--iris-tint);color:var(--iris);display:grid;place-items:center}
.round svg{width:22px;height:22px;stroke-width:3}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.presets button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;font-weight:700}
.presets button[aria-pressed="true"]{background:var(--iris);border-color:var(--iris);color:var(--iris-ink)}
.why{color:var(--ink-soft);font-size:15px;max-width:42ch}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}
.focus{background:var(--iris-tint);border-color:transparent}
.focus.brk{background:var(--mint-tint)}
.ringbig{position:relative;width:min(300px,76vw);aspect-ratio:1}
.ringbig svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbig .t{fill:none;stroke:var(--card);stroke-width:14;opacity:.75}
.ringbig .a{fill:none;stroke:var(--iris);stroke-width:14;stroke-linecap:round}
.brk .ringbig .a{stroke:var(--mint)}
.ringbig .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time{font-family:var(--display);font-weight:800;font-size:clamp(52px,14vw,72px);letter-spacing:-.03em;line-height:1}
.ctrls{display:flex;gap:22px;align-items:flex-start;justify-content:center}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:14px;color:var(--ink-soft);font-weight:500}
.ctl i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--iris);font-style:normal}
.ctl.main i{width:68px;height:68px;background:var(--iris);color:var(--iris-ink)}
.brk .ctl.main i{background:var(--mint);color:var(--mint-ink)}
.ctl i svg{width:24px;height:24px;stroke-width:2.6}
.banner{background:var(--card);border-radius:14px;padding:10px 14px;font-weight:700}
.done{background:var(--mint-tint);border-color:transparent}
.trophy{width:120px;height:120px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.breakdown{display:grid;gap:4px;width:100%;max-width:300px;font-size:15px}
.breakdown div{display:flex;justify-content:space-between}
.breakdown .tot{border-top:1px solid color-mix(in srgb,var(--ink) 18%,transparent);padding-top:6px;margin-top:2px;font-weight:800;font-size:20px;font-family:var(--display)}
.unlocks{display:flex;flex-direction:column;gap:6px;width:100%}
.unlock{background:var(--card);border-radius:14px;padding:8px 12px;font-size:15px;display:flex;gap:10px;align-items:center;text-align:left}
.unlock svg{color:var(--gold);width:22px;height:22px}

/* lists */
.sec{display:flex;flex-direction:column;gap:14px}
.sec h2{font-size:22px;font-weight:800}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.item .t{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.item .t small{display:block;color:var(--ink-soft);font-size:13px}
.item .pill{font-size:12px;padding:2px 10px}
.iconbtn{border:0;background:transparent;color:var(--ink-soft);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.iconbtn:hover{background:var(--iris-tint);color:var(--ink)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input[type=text],.addrow select,textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-width:0}
.addrow input[type=text]{flex:1 1 200px}
textarea{width:100%;min-height:92px;resize:vertical}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.badge svg{width:26px;height:26px;color:var(--gold)}
.badge b{font-size:15px;line-height:1.2}
.badge span{font-size:13px;color:var(--ink-soft);line-height:1.3}
.badge.lock{opacity:.5}
.badge.lock svg{color:var(--ink-soft)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:10px;font-weight:700}

.hdr{display:flex;gap:10px;align-items:center}
.themebtn{background:var(--card);border:1px solid var(--line);width:42px;height:42px;border-radius:14px;color:var(--iris)}
.themepanel{position:absolute;right:0;top:100%;margin-top:8px;z-index:30;width:270px;box-shadow:var(--shadow)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.seg{display:flex;background:var(--iris-tint);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:6px;font-weight:700;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.tabrow{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.tabrow nav.tabs{margin:0}
.paste{align-items:stretch;text-align:left;max-width:600px}
.paste .why{max-width:none}
.pastehead{display:flex;flex-direction:column;gap:8px}
.pastehead svg{width:40px;height:40px;color:var(--iris);stroke-width:1.8}
.paste textarea{min-height:200px;font-size:17px;line-height:1.5}
.paste .list{max-height:240px;overflow:auto}
.recap{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.recap p.r{font-size:17px}
.undo{margin-left:8px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,12,30,.62);display:grid;place-items:center;padding:16px}
.modalbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;max-width:500px;width:100%;max-height:96vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modalbox img{width:100%;max-height:56vh;object-fit:contain;border-radius:14px;background:var(--paper)}
.modalbox label{display:flex;gap:8px;align-items:center;font-weight:500}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.mrow .btn{flex:1 1 120px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,380px)}
.toast{background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-weight:500;animation:drop .35s ease-out}
.toast svg{color:var(--gold)}
@keyframes drop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:860px){
  .app{grid-template-columns:1fr;padding-top:14px}
  .rail{position:static;order:2}
  .mini{display:flex}
  .deck{height:380px}
  .actions{gap:40px}
}
@media (max-width:420px){
  .card{padding:20px 18px 16px}
  .meta{gap:6px}
  .meta svg{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <header class="top">
      <div>
        <h1 id="h1">Your Task Deck</h1>
        <p id="sub">Swipe to choose your next task.</p>
      </div>
      <div class="hdr"><div class="mini" id="mini" aria-hidden="true"></div><button class="iconbtn themebtn" id="themeBtn" aria-label="Change theme" aria-expanded="false" aria-controls="themePanel"></button></div>
      <div class="panel themepanel" id="themePanel" hidden></div>
    </header>
    <div class="tabrow" id="tabrow"><nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav><button class="btn sm primary" data-act="openpaste" id="pasteBtn"></button></div>
    <section id="stage" aria-live="off"></section>
  </main>
  <aside class="rail" id="rail" aria-label="Your progress"></aside>
</div>
<div class="modal" id="shareModal" role="dialog" aria-modal="true" aria-label="Share your celebration card" hidden><div class="modalbox" id="shareBox"></div></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const dayKey=(d=new Date())=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const P={
  share:'<circle cx="6" cy="12" r="2.500"/><circle cx="18" cy="6" r="2.500"/><circle cx="18" cy="18" r="2.500"/><path d="M8.300 10.800l7.400-3.600M8.300 13.200l7.400 3.600"/>',

  [/\b(walk|run|workout|gym|stretch|yoga|exercise|doctor|dentist|meditat|sleep|hydrate)\w*/i,"health",20,"Low"],

];
function guess(title,catOverride){
  let cat="life",est=15,focus="Medium";
  const words=title.trim().split(/\s+/).length;

  if(hit){cat=hit[1];est=hit[2];focus=hit[3]}

}

const BULLET=/^\s*(?:[-*•·☐☑✓▢]|\[[ xX]?\]|\d{1,2}[.)])\s+/;
function parseList(text){
  return text.split(/\r?\n/).map(l=>{
    let s=l;
    for(let i=0;i<2&&BULLET.test(s);i++)s=s.replace(BULLET,"");
    s=s.trim();if(!s)return null;
    let cat,est;
    const tag=s.match(/\s#(work|home|health|learning|learn|life)\b/i);
    if(tag){const c=tag[1].toLowerCase();cat=c==="learning"?"learn":c;s=s.replace(tag[0],"")}
    const tm=s.match(/\s*\(\s*(\d{1,3})\s*(hours|hour|hrs|hr|h|minutes|mins|min|m)\s*\)\s*$/i)||s.match(/\s*(?:~|[-–]\s)\s*(\d{1,3})\s*(hrs|hr|h|mins|min|m)\s*$/i)||s.match(/\s+(\d{1,3})\s*(hrs|hr|h|mins|min|m)\s*$/i);
    if(tm){const n=+tm[1];est=/^h/i.test(tm[2])?n*60:n;s=s.replace(tm[0],"")}
    s=s.trim();if(!s)return null;

/* ---------- swipe ---------- */
function attachSwipe(el){
  const later=el.querySelector(".stamp.later"),now=el.querySelector(".stamp.now");
  let sx=0,sy=0,dx=0,down=false,busy=false;
  const place=(x,y)=>{el.style.transform=`translate(${x}px,${y}px) rotate(${x/18}deg)`;later.style.opacity=Math.min(1,Math.max(0,-x/110));now.style.opacity=Math.min(1,Math.max(0,x/110))};
  el.addEventListener("pointerdown",e=>{if(busy||(e.button&&e.button>0))return;down=true;sx=e.clientX;sy=e.clientY;dx=0;try{el.setPointerCapture(e.pointerId)}catch(_){}el.style.transition="none"});
  el.addEventListener("pointermove",e=>{if(!down)return;dx=e.clientX-sx;place(dx,(e.clientY-sy)*.25)});
  const end=()=>{
    if(!down)return;down=false;
    if(dx>110)return fling(1);
    if(dx<-110)return fling(-1);
    el.style.transition=reduced?"none":"transform .25s cubic-bezier(.2,1.4,.4,1)";place(0,0);
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  function fling(dir){busy=true;el.style.transition=reduced?"none":"transform .28s ease-in, opacity .28s";place(dir*innerWidth*.8,0);el.style.opacity=0;setTimeout(()=>dir>0?swipeNow():swipeLater(),reduced?0:260)}
  el._fling=fling;
}
function swipeLater(){
  const o=open();if(!o.length)return;
  const t=o[0],at=S.tasks.indexOf(t);t.skips++;S.tasks.splice(at,1);S.tasks.push(t);ui.undo={id:t.id,at};
  ui.note=o.length>1?"Back later. No points lost.":"Back later. It is the only card, so it stays on top.";
  save();render();
}
function swipeNow(){const t=open()[0];if(t)pick(t.id)}
function pick(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;ui.undo=null;
  ui.pendingId=id;ui.suggested=suggest(t);ui.estMin=ui.suggested;ui.stage="estimate";ui.note="";render();
}

/* ---------- timer ---------- */
const getLeft=s=>s.pausedLeft!=null?s.pausedLeft:Math.max(0,s.endAt-Date.now());
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function startTicker(){clearInterval(ticker);ticker=setInterval(tick,250)}
function stopTicker(){clearInterval(ticker);ticker=null;document.title="Task Deck"}
function tick(){
  const isBreak=ui.stage==="break",s=isBreak?ui.brk:S.session;
  if(!s||!$("#time")){return}
  const left=getLeft(s);
  $("#time").textContent=fmt(left);
  $("#arc").style.strokeDashoffset=String(653.45*(1-left/s.totalMs));
  $("#of").textContent="of "+Math.round(s.totalMs/60000)+" min";
  document.title=fmt(left)+" · Task Deck";
  if(left<=0&&!s.notified){
    s.notified=true;chime(isBreak?[880,660]:[660,880,1100]);try{navigator.vibrate&&navigator.vibrate([120,80,120])}catch(e){}
    $("#banner").hidden=false;if(isBreak)$("#banner").textContent="Break is over. Ready when you are.";save();
  }
}
function startSession(){
  ensureAudio();
  const t=S.tasks.find(x=>x.id===ui.pendingId);if(!t)return;
  const ms=ui.estMin*60000;
  S.session={id:t.id,totalMs:ms,endAt:Date.now()+ms,pausedLeft:null,planned:ui.estMin,suggested:ui.suggested,notified:false};
  S.started++;ui.stage="focus";
  const a=checkAch({});save();render();a.forEach(x=>toast(x.name+" unlocked","trophy"));
}
function finish(){
  const s=S.session,t=S.tasks.find(x=>x.id===s.id);if(!t)return;
  const left=getLeft(s),elapsed=s.totalMs-left,planned=Math.round(s.totalMs/60000);
  const early=left>1000&&elapsed<=s.planned*60000;
  const base=xpFor(planned),bonus=early?Math.round(base*.25):0;
  const before=levelOf(S.xp),key=dayKey();
  t.status="done";t.doneAt=Date.now();t.planned=planned;
  S.days[key]=(S.days[key]||0)+1;S.mins[key]=(S.mins[key]||0)+Math.max(1,Math.round(elapsed/60000));
  const st=streak(),streakBonus=Math.min(st,5)*5;
  const xp=base+bonus+streakBonus;t.xp=xp;S.xp+=xp;S.best=Math.max(S.best,st);
  if(s.planned!==5||s.suggested===5){}
  if(!(s.planned===5&&s.suggested===5)){(S.hist[t.cat]=S.hist[t.cat]||[]).push({s:s.suggested,a:Math.max(1,Math.round(elapsed/60000))});S.hist[t.cat]=S.hist[t.cat].slice(-8)}
  const ach=checkAch({task:t,early,planned});
  const after=levelOf(S.xp);
  S.session=null;stopTicker();
  ui.doneInfo={task:t,mins:Math.max(1,Math.round(elapsed/60000)),xp,base,bonus,streakBonus,early,ach,level:after>before?after:null};
  ui.stage="done";ui.note="";chime([784,988,1175,1568]);save();render();confetti();
}
function stopSession(){
  const s=S.session,t=S.tasks.find(x=>x.id===s.id);
  const mins=Math.floor((s.totalMs-getLeft(s))/60000);
  S.xp+=mins;S.mins[dayKey()]=(S.mins[dayKey()]||0)+mins;S.session=null;stopTicker();ui.stage="deck";ui.tab="deck";
  if(t){S.tasks.splice(S.tasks.indexOf(t),1);S.tasks.unshift(t)}
  ui.note=mins>0?`Saved ${mins} min of focus (+${mins} XP). The card is still on top.`:"No problem. The card is still on top.";
  save();render();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const tb=e.target.closest("#themeBtn");
  if(tb){ui.themeOpen=!ui.themeOpen;return renderThemePanel()}
  const pal=e.target.closest("[data-pal]");if(pal){S.theme.p=pal.dataset.pal;save();applyTheme();return renderThemePanel()}
  const md=e.target.closest("[data-mode]");if(md){S.theme.m=md.dataset.mode;save();applyTheme();return renderThemePanel()}
  if(ui.themeOpen&&!e.target.closest("#themePanel")){ui.themeOpen=false;renderThemePanel()}
  const tabB=e.target.closest("[data-tab]");
  if(tabB){ui.tab=tabB.dataset.tab;ui.note="";ui.confirmReset=false;return render()}
  const pk=e.target.closest("[data-pick]");if(pk)return pick(pk.dataset.pick);
  const first=e.target.closest("[data-first]");
  if(first){const t=S.tasks.find(x=>x.id===first.dataset.first),i=S.tasks.indexOf(t);S.tasks.splice(i,1);const j=S.tasks.findIndex(x=>x.status==="todo");S.tasks.splice(j<0?0:j,0,t);save();return render()}
  const del=e.target.closest("[data-del]");
  if(del){S.tasks=S.tasks.filter(x=>x.id!==del.dataset.del);save();return render()}
  const pre=e.target.closest("[data-preset]");if(pre)return setEst(+pre.dataset.preset);
  const b=e.target.closest("[data-act]");if(!b)return;
  switch(b.dataset.act){
    case"later":{const c=$("#topcard");if(c&&c._fling)c._fling(-1);else swipeLater();break}
    case"now":{const c=$("#topcard");if(c&&c._fling)c._fling(1);else swipeNow();break}
    case"est-":setEst(ui.estMin-5);break;
    case"est+":setEst(ui.estMin+5);break;
    case"cancel":ui.stage="deck";render();break;
    case"start":startSession();break;
    case"pause":{const s=S.session;if(s.pausedLeft==null){s.pausedLeft=getLeft(s);$("#pauseLbl").textContent="Resume";$("#pauseBtn i").innerHTML=ic("play")}else{s.endAt=Date.now()+s.pausedLeft;s.pausedLeft=null;$("#pauseLbl").textContent="Pause";$("#pauseBtn i").innerHTML=ic("pause")}save();break}
    case"plus5":{const s=ui.stage==="break"?ui.brk:S.session;s.totalMs+=300000;if(s.pausedLeft!=null)s.pausedLeft+=300000;else s.endAt+=300000;s.notified=false;$("#banner").hidden=true;save();tick();break}
    case"stop":stopSession();break;
    case"finish":finish();break;
    case"next":ui.stage="deck";ui.tab="deck";render();break;
    case"break":{ensureAudio();ui.brk={totalMs:300000,endAt:Date.now()+300000,pausedLeft:null,notified:false};ui.stage="break";render();break}
    case"endbreak":stopTicker();ui.brk=null;ui.stage="deck";ui.tab="deck";render();break;
    case"sharetask":openShare("task");break;
    case"shareday":openShare("day");break;
    case"doshare":doShare();break;
    case"dosave":doSave();break;
    case"docopy":doCopy();break;
    case"closeshare":closeShare();break;
    case"openpaste":ui.stage="paste";ui.note="";ui.undo=null;render();break;
    case"cancelpaste":ui.stage="deck";render();break;
    case"examples":S.onboarded=true;ui.stage="deck";ui.tab="deck";save();render();break;
    case"makedeck":{const items=parseList($("#pasteText").value);if(!items.length)break;S.tasks=S.tasks.filter(t=>!(t.ex&&t.status==="todo"));items.forEach(i=>addTask(i.title,i.cat,i.est));S.onboarded=true;ui.stage="deck";ui.tab="deck";ui.note=`Added ${items.length} card${items.length>1?"s":""}. Swipe right to start one.`;save();render();break}
    case"undo":{const u=ui.undo;ui.undo=null;const t=u&&S.tasks.find(x=>x.id===u.id);if(t){t.skips=Math.max(0,t.skips-1);S.tasks.splice(S.tasks.indexOf(t),1);S.tasks.splice(Math.min(u.at,S.tasks.length),0,t);ui.note="Put back on top.";save();render()}break}
    case"copyrecap":{const txt=ui.recap;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Recap copied","check"),()=>toast("Copy is blocked here. Select the text and copy it.","list"));break}
    case"clearex":S.tasks=S.tasks.filter(t=>!(t.ex&&t.status==="todo"));save();render();break;
    case"goal-":S.goal=Math.max(1,S.goal-1);save();renderRail();$("#goalNum").textContent=S.goal;break;
    case"goal+":S.goal=Math.min(20,S.goal+1);save();renderRail();$("#goalNum").textContent=S.goal;break;
    case"mute":S.mute=!S.mute;save();render();break;
    case"reset":if(!ui.confirmReset){ui.confirmReset=true;render()}else{S=fresh();ui.confirmReset=false;ui.tab="deck";ui.stage="paste";save();applyTheme();render()}break;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="pasteText")updatePaste()});
document.addEventListener("change",e=>{if(e.target.id==="shTitle"&&shareCtx){shareCtx.showTitle=e.target.checked;regenShare()}});
$("#shareModal").addEventListener("click",e=>{if(e.target.id==="shareModal")closeShare()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&shareCtx)return closeShare();if(e.key==="Escape"&&ui.themeOpen){ui.themeOpen=false;renderThemePanel();$("#themeBtn").focus()}});
document.addEventListener("submit",e=>{
  if(e.target.id!=="addForm")return;e.preventDefault();
  const v=$("#newTitle").value.trim();if(!v)return;
  addTask(v,$("#newCat").value);save();render();$("#newTitle")&&$("#newTitle").focus();
});
function addTask(title,cat,est){
  const g=guess(title,cat);let e=g.est,f=g.focus,fixed=false;
  if(est){e=Math.max(5,Math.min(180,Math.round(est/5)*5));f=e<=10?"Low":e>=30?"High":"Medium";fixed=true}
  S.tasks.push({id:uid(),title:title.slice(0,140),cat:g.cat,est:e,focus:f,fixed,skips:0,status:"todo"});
}
function renderPaste(el){
  const first=!S.onboarded,hasEx=S.tasks.some(t=>t.ex&&t.status==="todo");
  el.innerHTML=`<div class="sheet paste">
    <div class="pastehead">${ic("paste")}<p class="why">One task per line. Bullets and checkboxes are fine. Add a time like (20m) or a tag like #home if you want to set them yourself.</p></div>
    <textarea id="pasteText" aria-label="Your to-do list, one task per line" placeholder="Reply to Sam about the schedule (10m)&#10;- Draft the quarterly report #work&#10;[ ] Fold the laundry&#10;Call the dentist&#10;Go for a walk 20m"></textarea>
    <p class="small num" id="pasteCount" aria-live="polite">0 tasks found</p>
    <ul class="list" id="pastePreview"></ul>
    ${!first&&hasEx?'<p class="small">Your list replaces the example cards.</p>':""}
    <div class="stack"><button class="btn primary big" data-act="makedeck" id="makeBtn" disabled>${first?"Make my deck":"Add to my deck"}</button>${first?'<button class="btn ghost" data-act="examples">Try it with example tasks</button>':'<button class="btn ghost" data-act="cancelpaste">Cancel</button>'}</div>
  </div>`;
  $("#pasteText").focus();
}
function updatePaste(){
  const items=parseList($("#pasteText").value),n=items.length;
  $("#pasteCount").textContent=n?`${n} task${n>1?"s":""} found`:"0 tasks found";
  const b=$("#makeBtn");b.disabled=!n;
  b.textContent=!S.onboarded?(n?`Make my deck (${n})`:"Make my deck"):(n?`Add ${n} card${n>1?"s":""}`:"Add to my deck");
  $("#pastePreview").innerHTML=items.slice(0,6).map(i=>{const g=guess(i.title,i.cat);const m=i.est?Math.max(5,Math.round(i.est/5)*5):g.est;return `<li class="item"><span class="pill cat-${g.cat}">${CATS[g.cat]}</span><span class="t">${esc(i.title)}</span><span class="small num">${m} min</span></li>`}).join("")+(n>6?`<li class="small">and ${n-6} more</li>`:"");
}
document.addEventListener("keydown",e=>{
  if(ui.stage!=="deck"||ui.tab!=="deck")return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const c=$("#topcard");if(!c||!c._fling)return;
  if(e.key==="ArrowLeft"){e.preventDefault();c._fling(-1)}
  if(e.key==="ArrowRight"){e.preventDefault();c._fling(1)}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(ui.stage==="focus"||ui.stage==="break"))tick()});

function render(){renderRail();renderTabs();renderStage();renderThemePanel()}
$("#themeBtn").innerHTML=ic("palette");
applyTheme();render();
if(ui.stage==="focus")startTicker();
initRemote();
</script>
</body>
</html>
